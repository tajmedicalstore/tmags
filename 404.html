<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Taj Medical Store</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root { --taj-blue:#1a5ca3; --emerald-600:#059669; --medical-red:#e53e3e; --text-primary:#1e293b; --text-secondary:#64748b; --bg-body:#f8fafc; --border-color:#e2e8f0; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Plus Jakarta Sans', -apple-system, sans-serif; background:var(--bg-body); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
    .card { background:#fff; border-radius:24px; padding:48px 32px; max-width:420px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.08); border:1px solid var(--border-color); }
    .icon-wrap { width:90px; height:90px; border-radius:20px; background:#fef2f2; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
    .icon-wrap i { font-size:2.4rem; color:var(--medical-red); }
    h1 { font-size:1.7rem; font-weight:900; color:var(--text-primary); margin-bottom:10px; }
    p { color:var(--text-secondary); font-size:0.95rem; line-height:1.6; margin-bottom:28px; }
    .btn { display:block; width:100%; padding:15px; border-radius:14px; font-weight:800; font-size:0.9rem; text-decoration:none; cursor:pointer; border:none; margin-bottom:12px; }
    .btn-primary { background:var(--emerald-600); color:#fff; }
    .btn-outline { background:#fff; color:var(--text-primary); border:1px solid var(--border-color); }
    .code { font-size:0.72rem; color:var(--text-secondary); opacity:0.7; margin-top:10px; }
    .logo { width:56px; height:56px; object-fit:contain; margin-bottom:18px; }
</style>
</head>
<body>
    <div class="card">
        <img src="logo.png" alt="" class="logo" onerror="this.style.display='none'">
        <div class="icon-wrap"><i class="fas fa-flag"></i></div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has moved. Please check the link, or head back to the dashboard.</p>
        <a href="index.html" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <button class="btn btn-outline" onclick="history.back()">Try Previous Page</button>
        <p class="code">Error Code: 404</p>
    </div>
</body>
</html>
