<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Offline — Taj Medical Store</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root { --taj-blue:#1a5ca3; --emerald-600:#059669; --medical-red:#e53e3e; --text-primary:#1e293b; --text-secondary:#64748b; --bg-body:#f8fafc; --bg-surface:#fff; --border-color:#e2e8f0; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Plus Jakarta Sans', -apple-system, sans-serif; background:var(--bg-body); min-height:100vh; padding:24px; }
    .wrap { max-width:480px; margin:0 auto; }
    .card { background:#fff; border-radius:24px; padding:48px 32px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.08); border:1px solid var(--border-color); text-align:center; }
    .icon-wrap { width:90px; height:90px; border-radius:50%; background:#fff7ed; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
    .icon-wrap i { font-size:2.2rem; color:#ea8a1f; }
    h1 { font-size:1.7rem; font-weight:900; color:var(--text-primary); margin-bottom:10px; }
    p { color:var(--text-secondary); font-size:0.95rem; line-height:1.6; margin-bottom:28px; }
    .btn { display:block; width:100%; padding:15px; border-radius:14px; font-weight:800; font-size:0.9rem; text-decoration:none; cursor:pointer; border:none; margin-bottom:12px; text-align:center; }
    .btn-primary { background:var(--emerald-600); color:#fff; }
    .btn-outline { background:#fff; color:var(--text-primary); border:1px solid var(--border-color); }
    .code { font-size:0.72rem; color:var(--text-secondary); opacity:0.7; margin-top:10px; }
    .logo { width:56px; height:56px; object-fit:contain; margin-bottom:18px; }

    /* Light site */
    #lightSite { display:none; margin-top:20px; }
    .ls-card { background:var(--bg-surface); border:1px solid var(--border-color); border-radius:16px; padding:18px; margin-bottom:14px; text-align:left; }
    .ls-card h3 { font-size:0.95rem; font-weight:900; margin-bottom:10px; color:var(--text-primary); }
    .ls-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-color); font-size:0.85rem; }
    .ls-row:last-child { border-bottom:none; }
    .ls-cat { display:inline-block; background:var(--bg-body); border-radius:8px; padding:6px 12px; font-size:0.78rem; font-weight:700; margin:0 6px 6px 0; }
    .ls-badge { font-size:0.65rem; font-weight:800; padding:2px 8px; border-radius:6px; }
    .ls-in { background:#dcfce7; color:#166534; }
    .ls-out { background:#fee2e2; color:#991b1b; }
    .no-data { text-align:center; color:var(--text-secondary); font-size:0.85rem; padding:20px; }
</style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <img src="logo.png" alt="" class="logo" onerror="this.style.display='none'">
            <div class="icon-wrap"><i class="fas fa-wifi"></i></div>
            <h1>You're Offline</h1>
            <p>It looks like you've lost your internet connection. Please check your network settings and try again.</p>
            <button class="btn btn-primary" onclick="location.reload()"><i class="fas fa-rotate-right"></i> Try Again</button>
            <a href="index.html" class="btn btn-outline"><i class="fas fa-house"></i> Go to Home</a>
            <button class="btn btn-outline" id="lightSiteToggle" onclick="toggleLightSite()"><i class="fas fa-bolt"></i> View Light Site (offline info)</button>
            <p class="code">Error Code: NETWORK_OFFLINE</p>
        </div>

        <div id="lightSite">
            <div class="ls-card">
                <h3><i class="fas fa-phone" style="color:var(--emerald-600);"></i> Contact</h3>
                <div id="lsContact"></div>
            </div>
            <div class="ls-card">
                <h3><i class="fas fa-layer-group" style="color:var(--emerald-600);"></i> Categories</h3>
                <div id="lsCategories"></div>
            </div>
            <div class="ls-card">
                <h3><i class="fas fa-pills" style="color:var(--emerald-600);"></i> Stock (last synced)</h3>
                <div id="lsStock"></div>
            </div>
        </div>
    </div>

    <script>
        // This reads whatever was cached in localStorage the last time
        // index.html loaded successfully — genuinely works with no network,
        // since it's just local browser storage, not a live fetch.
        function toggleLightSite() {
            const el = document.getElementById('lightSite');
            const shown = el.style.display === 'block';
            el.style.display = shown ? 'none' : 'block';
            document.getElementById('lightSiteToggle').innerHTML = shown
                ? '<i class="fas fa-bolt"></i> View Light Site (offline info)'
                : '<i class="fas fa-xmark"></i> Hide Light Site';
            if (!shown) renderLightSite();
        }

        function renderLightSite() {
            let data = null;
            try { data = JSON.parse(localStorage.getItem('tms_site_data_v1')); } catch (e) {}

            if (!data) {
                ['lsContact', 'lsCategories', 'lsStock'].forEach(id => {
                    document.getElementById(id).innerHTML = '<p class="no-data">No cached data yet — visit the site once while online first.</p>';
                });
                return;
            }

            const c = data.contact || {};
            document.getElementById('lsContact').innerHTML = `
                <div class="ls-row"><span>Phone</span><strong>${c.phone || '—'}</strong></div>
                <div class="ls-row"><span>WhatsApp</span><strong>${c.whatsapp || '—'}</strong></div>
                <div class="ls-row"><span>Address</span><strong style="text-align:right; max-width:60%;">${c.address || '—'}</strong></div>
            `;

            const cats = data.categories || [];
            document.getElementById('lsCategories').innerHTML = cats.length
                ? cats.map(cat => `<span class="ls-cat">${cat.title}</span>`).join('')
                : '<p class="no-data">No categories cached.</p>';

            const stock = data.stock || [];
            document.getElementById('lsStock').innerHTML = stock.length
                ? stock.map(s => `<div class="ls-row"><span>${s.name}</span><span><strong>Rs.${s.price}</strong> <span class="ls-badge ${s.stock ? 'ls-in' : 'ls-out'}">${s.stock ? 'In Stock' : 'Out'}</span></span></div>`).join('')
                : '<p class="no-data">No stock data cached.</p>';
        }
    </script>
</body>
</html>
